name: Release

# Builds the multi-arch image for a version tag, pushes it to Docker Hub,
# checks the amd64 image starts and reports the right version, then opens a
# draft GitHub release for the maintainer to write up. See RELEASING.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build again, for example v0.3.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: wardy784/erugo

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
    steps:
      - name: Work out tag and version
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Building $TAG as version $VERSION (pre-release: $PRERELEASE)"

      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.vars.outputs.tag }}
          persist-credentials: false

      # On a manual re-run github.sha is the branch head, not the tag, so read
      # the commit from the checkout instead.
      - name: Read the commit
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Plain release vX.Y.Z: X.Y.Z, X.Y, X, latest and sha-<short>.
      # Pre-release (anything with a "-"): the exact version and sha-<short> only.
      - name: Work out image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.vars.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.vars.outputs.tag }},enable=${{ steps.vars.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ steps.vars.outputs.tag }},enable=${{ steps.vars.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.prerelease == 'false' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.title=Erugo
            org.opencontainers.image.description=Self-hosted file sharing
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      # context: . builds from the checked-out files, so .dockerignore decides
      # what goes into the image.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test amd64 image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull, start and check the image
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE_REF"
          docker run -d --name erugo-ci-smoke --platform linux/amd64 \
            -p 127.0.0.1:8080:80 \
            -v erugo-ci-smoke-storage:/var/www/html/storage \
            "$IMAGE_REF"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs erugo-ci-smoke 2>&1 | tail -n 100
            fi
            docker rm -f erugo-ci-smoke >/dev/null 2>&1 || true
            docker volume rm erugo-ci-smoke-storage >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          code=000
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::/api/health returned $code"
            exit 1
          fi
          echo "/api/health returned 200"

          if ! curl -fsS http://127.0.0.1:8080/ | grep -qF "data-version=\"$VERSION\""; then
            echo "::error::The home page does not show version $VERSION"
            exit 1
          fi
          echo "The home page shows version $VERSION"

  release:
    name: Draft GitHub release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create a draft release if there isn't one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists, leaving it alone."
            exit 0
          fi
          flags="--draft --verify-tag"
          if [ "$PRERELEASE" = "true" ]; then
            flags="$flags --prerelease"
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" $flags --title "$TAG" --notes ""
          echo "Created a draft release for $TAG. Write the notes and publish it on GitHub."
